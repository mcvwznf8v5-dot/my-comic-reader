<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的漫画阅读器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #1a1a1a; color: white; font-family: Arial, sans-serif; }
        .container { display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .nav-buttons { margin: 20px 0; }
        button { background-color: #ff6b6b; border: none; padding: 10px 20px; color: white; border-radius: 5px; margin: 0 10px; cursor: pointer; }
        img { max-width: 100%; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav-buttons">
            <button onclick="prevPage()">上一张</button>
            <button onclick="nextPage()">下一张</button>
        </div>
        <img id="comic-img" src="" alt="漫画" />
    </div>

    <script>
        const images = ['微信图片_20261113002122_66_2.jpg']; // 漫画图片列表
        let currentIndex = 0;

        function updateImage() {
            document.getElementById('comic-img').src = images[currentIndex];
        }

        function nextPage() {
            if (currentIndex < images.length - 1) {
                currentIndex++;
                updateImage();
            }
        }

        function prevPage() {
            if (currentIndex > 0) {
                currentIndex--;
                updateImage();
            }
        }

        updateImage();
    </script>
</body>
</html>
