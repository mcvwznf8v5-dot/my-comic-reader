<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>漫画阅读器</title>
<script src="https://unpkg.com/jszip/dist/jszip.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #111;
    color: #eee;
    font-family: sans-serif;
    padding: 12px;
  }
  h1 { font-size: 18px; margin-bottom: 12px; }
  .controls {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .controls button,
  .controls label {
    background: #333;
    border: none;
    color: #eee;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
  }
  .controls input[type="file"] { display: none; }
  #status {
    font-size: 13px;
    color: #aaa;
    margin-bottom: 10px;
  }
  #pageInfo {
    font-size: 13px;
    color: #ccc;
    margin-bottom: 8px;
  }
  #viewer {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 60vh;
  }
  #viewer img {
    max-width: 100%;
    max-height: 85vh;
    display: block;
    border-radius: 4px;
  }
  .nav-buttons {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 12px;
  }
  .nav-buttons button {
    background: #444;
    border: none;
    color: #eee;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 15px;
  }
  .thumb-list {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding: 8px 0;
    margin-top: 12px;
  }
  .thumb-list img {
    width: 80px;
    height: 110px;
    object-fit: cover;
    border-radius: 4px;
    border: 2px solid transparent;
    cursor: pointer;
    flex-shrink: 0;
  }
  .thumb-list img.active {
    border-color: #5af;
  }
  .hidden { display: none; }
</style>
</head>
<body>
<h1>📖 漫画阅读器</h1>
<div class="controls">
  <label for="comicFile">📂 选择漫画压缩包</label>
  <input type="file" id="comicFile" accept=".zip,.cbz,.ZIP,.CBZ,application/zip,application/vnd.comicbook+zip" />
  <button id="prevBtn" class="hidden">⬅ 上一页</button>
  <button id="nextBtn" class="hidden">下一页 ➡</button>
</div>
<div id="status">请选择一个 .zip 或 .cbz 漫画压缩包</div>
<div id="pageInfo" class="hidden"></div>
<div id="viewer"></div>
<div class="nav-buttons hidden" id="navButtons">
  <button id="prevBtn2">⬅ 上一页</button>
  <button id="nextBtn2">下一页 ➡</button>
</div>
<div class="thumb-list hidden" id="thumbList"></div>
<script>
let pages = [];       // [{ name, blob, url }]
let currentIndex = 0;
const STORAGE_KEY = 'comic_reader_progress';
const fileInput = document.getElementById('comicFile');
const statusEl = document.getElementById('status');
const pageInfoEl = document.getElementById('pageInfo');
const viewerEl = document.getElementById('viewer');
const thumbListEl = document.getElementById('thumbList');
const navButtons = document.getElementById('navButtons');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const prevBtn2 = document.getElementById('prevBtn2');
const nextBtn2 = document.getElementById('nextBtn2');
/* ------------------------------------------------------------------
 * 核心加载逻辑：把「一个 File / Blob + 显示名」变成阅读界面。
 * 网页里手动选文件、以及安卓通过 Intent 送进来的文件，都走这一个函数。
 * ------------------------------------------------------------------ */
async function openComicFile(file, displayName) {
  const title = displayName || file.name || 'comic.zip';
  statusEl.textContent = '正在解压，请稍候...';
  resetReader();
  try {
    const zip = await JSZip.loadAsync(file);
    const imageFiles = Object.keys(zip.files)
      .filter(name => !zip.files[name].dir && /\.(jpg|jpeg|png|webp|gif|bmp)$/i.test(name))
      .sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
    if (imageFiles.length === 0) {
      statusEl.textContent = '压缩包内没有找到图片文件';
      return;
    }
    statusEl.textContent = `共 ${imageFiles.length} 页，正在加载...`;
    for (const name of imageFiles) {
      const blob = await zip.files[name].async('blob');
      const url = URL.createObjectURL(blob);
      pages.push({ name, blob, url });
    }
    currentIndex = 0;
    statusEl.textContent = `已加载 ${pages.length} 页`;
    showPage(0);
    navButtons.classList.remove('hidden');
    prevBtn.classList.remove('hidden');
    nextBtn.classList.remove('hidden');
    thumbListEl.classList.remove('hidden');
    pageInfoEl.classList.remove('hidden');
    buildThumbnails();
    saveProgress(title, 0);
  } catch (err) {
    statusEl.textContent = '解压失败：' + err.message;
    console.error(err);
  }
}
fileInput.addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  e.target.value = '';   // 允许再次选择同一个文件时仍然触发 change
  await openComicFile(file, file.name);
});
function resetReader() {
  pages.forEach(p => URL.revokeObjectURL(p.url));
  pages = [];
  currentIndex = 0;
  viewerEl.innerHTML = '';
  thumbListEl.innerHTML = '';
  navButtons.classList.add('hidden');
  prevBtn.classList.add('hidden');
  nextBtn.classList.add('hidden');
  pageInfoEl.classList.add('hidden');
  thumbListEl.classList.add('hidden');
}
function showPage(index) {
  if (index < 0 || index >= pages.length) return;
  currentIndex = index;
  viewerEl.innerHTML = '';
  const img = document.createElement('img');
  img.src = pages[index].url;
  img.alt = pages[index].name;
  viewerEl.appendChild(img);
  pageInfoEl.textContent = `第 ${index + 1} / ${pages.length} 页`;
  updateThumbActive();
  saveProgress(null, index);
}
function buildThumbnails() {
  thumbListEl.innerHTML = '';
  pages.forEach((page, i) => {
    const thumb = document.createElement('img');
    thumb.src = page.url;
    thumb.alt = page.name;
    thumb.addEventListener('click', () => showPage(i));
    thumbListEl.appendChild(thumb);
  });
  updateThumbActive();
}
function updateThumbActive() {
  const thumbs = thumbListEl.querySelectorAll('img');
  thumbs.forEach((t, i) => {
    t.classList.toggle('active', i === currentIndex);
    if (i === currentIndex) t.scrollIntoView({ behavior: 'smooth', inline: 'center' });
  });
}
function saveProgress(fileName, index) {
  try {
    const prev = loadProgress();
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      fileName: fileName || (prev && prev.fileName) || null,
      index
    }));
  } catch (e) {}
}
function loadProgress() {
  try {
    const data = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (data && typeof data.index === 'number') return data;
  } catch (e) {}
  return null;
}
prevBtn.addEventListener('click', () => showPage(currentIndex - 1));
nextBtn.addEventListener('click', () => showPage(currentIndex + 1));
prevBtn2.addEventListener('click', () => showPage(currentIndex - 1));
nextBtn2.addEventListener('click', () => showPage(currentIndex + 1));
// 左右滑动翻页
let touchStartX = 0;
viewerEl.addEventListener('touchstart', (e) => {
  touchStartX = e.changedTouches[0].screenX;
});
viewerEl.addEventListener('touchend', (e) => {
  const diff = e.changedTouches[0].screenX - touchStartX;
  if (diff > 50) showPage(currentIndex - 1);
  else if (diff < -50) showPage(currentIndex + 1);
});
/* ==================================================================
 * 安卓端接住「用其他应用打开 / 分享」进来的 zip、cbz 文件
 * ------------------------------------------------------------------
 * 原生端（ComicIntent.kt）干三件事：
 *   1. 把 content:// 或 file:// 的文件整个复制到 App 缓存目录；
 *   2. 通过 addJavascriptInterface 暴露 window.PPOpen；
 *   3. 复制完之后调用 window.__ppComicReady()。
 *
 * 这里用「JS 主动按块拉取」的方式取字节，避免一次塞一个几百 MB
 * 的字符串进 WebView 导致内存爆掉。
 * ================================================================== */
const pickUpAndroidFile = (() => {
  let busy = false;      // 防止并发/重复读取
  return async function pickup() {
    const bridge = window.PPOpen;
    // 在普通浏览器里 PPOpen 不存在，直接跳过
    if (!bridge || typeof bridge.hasPending !== 'function') return;
    if (busy) return;
    let hasPending = false;
    try { hasPending = !!bridge.hasPending(); } catch (e) { return; }
    if (!hasPending) return;
    busy = true;
    try {
      const name = (bridge.name && bridge.name()) || 'comic.zip';
      const total = Number(bridge.size());
      if (!total) { statusEl.textContent = '读取文件失败：文件是空的'; return; }
      statusEl.textContent = `正在从系统读取 ${name}（${(total / 1048576).toFixed(1)} MB）...`;
      const CHUNK = 512 * 1024;          // 每次拉 512KB
      const bytes = new Uint8Array(total);
      let offset = 0;
      let sinceYield = 0;
      while (offset < total) {
        const want = Math.min(CHUNK, total - offset);
        const b64 = bridge.chunk(offset, want);
        if (!b64) break;
        const bin = atob(b64);
        for (let i = 0; i < bin.length; i++) {
          bytes[offset + i] = bin.charCodeAt(i);
        }
        offset += bin.length;
        statusEl.textContent =
          `正在从系统读取 ${name} ... ${Math.floor(offset * 100 / total)}%`;
        // 每读 4MB 让出一次主线程，否则进度数字不会刷新、界面像卡死
        if (++sinceYield >= 8) {
          sinceYield = 0;
          await new Promise(resolve => setTimeout(resolve, 0));
        }
      }
      bridge.clear();
      if (offset !== total) {
        statusEl.textContent = '读取文件不完整，请重试';
        return;
      }
      const blob = new Blob([bytes], { type: 'application/zip' });
      await openComicFile(blob, name);
    } catch (err) {
      statusEl.textContent = '读取文件失败：' + err.message;
      console.error(err);
    } finally {
      busy = false;
    }
  };
})();
// 原生端复制完文件后会调用它；页面没加载完时调用会落空，所以下面还有轮询兜底
window.__ppComicReady = pickUpAndroidFile;
// 冷启动场景：Intent 在页面加载前就到了。轮询 20 秒内发现就自动打开。
(function autoPickupOnStart() {
  pickUpAndroidFile();
  let tries = 0;
  const timer = setInterval(() => {
    pickUpAndroidFile();
    if (++tries >= 40) clearInterval(timer);
  }, 500);
})();
</script>
</body>
</html>
